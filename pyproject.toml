[project]
name = "btc-swing-trading-bot"
version = "1.0.0"
description = "TradingView webhook to transactional paper futures trading"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
